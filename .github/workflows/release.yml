# La app de producción, firmada (D2): con una etiqueta vX.Y.Z se publica en GitHub Releases (A1); a mano («Run
# workflow») queda como artefacto de prueba, sin publicar. Los secretos y la etiqueta están en docs/despliegue.md.
name: Versión de la app

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  # Crear la versión en GitHub Releases.
  contents: write

concurrency:
  group: version-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Versión
        run: |
          # v1.2.3 → 1.2.3 (versionCode 10203, app/build.gradle.kts). La de prueba no se publica.
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.1"; fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # Sin alguno, el APK saldría sin firma o con el mapa gris: mejor no sacar nada.
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD MAPS_API_KEY; do
            [ -n "${!name}" ] || { echo "::error::Falta el secreto $name del repositorio (docs/despliegue.md)."; exit 1; }
          done
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK firmado
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Comprobación de la firma
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          # Las huellas no son secretas: quedan en el registro para revisar.
          echo "$CERTS" | grep "SHA-256" || true
          # La línea cambia con la versión de apksigner: «Signer #1 certificate SHA-256 digest: …» (36),
          # «V2 Signer: certificate SHA-256 digest: …» (37) o «Signer (minSdkVersion=…) certificate …».
          SIGNED=$(echo "$CERTS" | sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$(echo "$SIGNED" | grep -c .)" != 1 ]; then
            echo "::error::No se pudo leer una sola huella SHA-256 de la firma del APK."
            exit 1
          fi
          # La huella tiene que ser una de las que publica la API en assetlinks.json; si no, los App Links no se verifican.
          if ! echo "$ANDROID_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f' | tr ',' '\n' | grep -qx "$SIGNED"; then
            echo "::error::El APK está firmado con $SIGNED, que no está en la variable ANDROID_CERT_SHA256."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/salida"
          cp "$APK" "$RUNNER_TEMP/salida/ExploraCity-$RELEASE_VERSION.apk"

      - name: Publicar en GitHub Releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/salida/ExploraCity-$RELEASE_VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "ExploraCity $RELEASE_VERSION" --generate-notes

      - name: APK de prueba
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ExploraCity-prueba
          path: ${{ runner.temp }}/salida/*.apk
          retention-days: 7

      - name: Borrar el keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
