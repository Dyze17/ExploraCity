ktor {
    deployment {
        port = 8080
        # Cloud Run inyecta el puerto en PORT (ADR-10).
        port = ${?PORT}
    }
    application {
        modules = [ co.edu.uniquindio.exploracity.ApplicationKt.module ]
    }
}

# Lo secreto llega por variables de entorno: en desarrollo desde api-ktor/.env (fuera de git, ver .env.example) y en
# Cloud Run desde sus secretos. Sin JWT_SECRET la API no arranca.
exploracity {
    database {
        url = "jdbc:postgresql://localhost:5432/exploracity"
        url = ${?DATABASE_URL}
        user = "exploracity"
        user = ${?DATABASE_USER}
        password = ""
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = 10
        maxPoolSize = ${?DATABASE_POOL_SIZE}
    }

    jwt {
        secret = ""
        secret = ${?JWT_SECRET}
        issuer = "exploracity-api"
        audience = "exploracity-app"
        # ADR-06 (D1): token de acceso corto y token de renovación largo.
        accessMinutes = 15
        refreshDays = 30
    }

    # Correos de las cuentas de moderador, separados por comas (ADR-06: cuentas precargadas).
    moderators = ""
    moderators = ${?MODERATOR_EMAILS}

    # La ciudad que atiende la app (F2): nombre, centro del mapa, límites de la búsqueda por dirección y la zona
    # horaria con la que se calculan «abierto ahora» y «Tu trabajo de hoy».
    city {
        name = "Armenia"
        center { latitude = 4.5339, longitude = -75.6811 }
        southwest { latitude = 4.47, longitude = -75.76 }
        northeast { latitude = 4.6, longitude = -75.62 }
        timeZone = "America/Bogota"
    }

    # C1 · Correo. Con SENDGRID_API_KEY se envía de verdad desde MAIL_FROM. Sin ella, los correos quedan en un buzón de
    # desarrollo que solo se consulta en /v1/dev con DEV_MAILBOX=true; nunca por omisión, porque en producción no existe.
    # Lo que queda vacío toma el valor por omisión de MailSettings (config/AppConfig.kt).
    mail {
        sendGridApiKey = ""
        sendGridApiKey = ${?SENDGRID_API_KEY}
        from = ""
        from = ${?MAIL_FROM}
        fromName = ""
        fromName = ${?MAIL_FROM_NAME}
        devMailbox = ""
        devMailbox = ${?DEV_MAILBOX}
        # Dónde abren los enlaces del correo (6.b y «Cambiar correo»): la app los recibe con su token.
        linkBaseUrl = ""
        linkBaseUrl = ${?APP_LINK_BASE_URL}
    }

    # C1 · Fotos (ADR-07). Con las tres claves de Cloudinary van allá; sin ellas, a una carpeta local (fuera de git) que
    # la API sirve en /media. Lo vacío toma el valor por omisión de MediaSettings.
    media {
        cloudinary {
            cloudName = ""
            cloudName = ${?CLOUDINARY_CLOUD_NAME}
            apiKey = ""
            apiKey = ${?CLOUDINARY_API_KEY}
            apiSecret = ""
            apiSecret = ${?CLOUDINARY_API_SECRET}
        }
        localDir = ""
        localDir = ${?MEDIA_DIR}
        # Comienzo de las direcciones de la carpeta local; desde el teléfono, la IP del equipo en la red.
        publicBaseUrl = ""
        publicBaseUrl = ${?PUBLIC_BASE_URL}
    }
}
