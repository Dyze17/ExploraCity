ktor {
    deployment {
        port = 8080
        # Cloud Run inyecta el puerto en PORT (ADR-10).
        port = ${?PORT}
    }
    application {
        modules = [ co.edu.uniquindio.exploracity.ApplicationKt.module ]
    }
}

# Lo secreto llega por variables de entorno: en desarrollo desde api-ktor/.env (fuera de git, ver .env.example) y en
# Cloud Run desde sus secretos. Sin JWT_SECRET la API no arranca.
exploracity {
    database {
        url = "jdbc:postgresql://localhost:5432/exploracity"
        url = ${?DATABASE_URL}
        user = "exploracity"
        user = ${?DATABASE_USER}
        password = ""
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = 10
        maxPoolSize = ${?DATABASE_POOL_SIZE}
    }

    jwt {
        secret = ""
        secret = ${?JWT_SECRET}
        issuer = "exploracity-api"
        audience = "exploracity-app"
        # ADR-06 (D1): token de acceso corto y token de renovación largo.
        accessMinutes = 15
        refreshDays = 30
    }

    # Correos de las cuentas de moderador, separados por comas (ADR-06: cuentas precargadas).
    moderators = ""
    moderators = ${?MODERATOR_EMAILS}

    # La ciudad que atiende la app (F2): nombre, centro del mapa, límites de la búsqueda por dirección y la zona
    # horaria con la que se calculan «abierto ahora» y «Tu trabajo de hoy».
    city {
        name = "Armenia"
        center { latitude = 4.5339, longitude = -75.6811 }
        southwest { latitude = 4.47, longitude = -75.76 }
        northeast { latitude = 4.6, longitude = -75.62 }
        timeZone = "America/Bogota"
    }
}
