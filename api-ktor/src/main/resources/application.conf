ktor {
    deployment {
        port = 8080
        # Cloud Run inyecta el puerto en PORT (ADR-10).
        port = ${?PORT}
    }
    application {
        modules = [ co.edu.uniquindio.exploracity.ApplicationKt.module ]
    }
}

# Lo secreto llega por variables de entorno: en desarrollo desde api-ktor/.env (fuera de git, ver .env.example) y en
# Cloud Run desde sus secretos. Sin JWT_SECRET la API no arranca.
exploracity {
    # development (o vacío) en el equipo; production en Cloud Run, donde la API no arranca sin SendGrid, sin Cloudinary,
    # con DEV_MAILBOX o con enlaces del correo que no sean https (docs/despliegue.md).
    environment = ""
    environment = ${?APP_ENV}

    database {
        url = "jdbc:postgresql://localhost:5432/exploracity"
        url = ${?DATABASE_URL}
        user = "exploracity"
        user = ${?DATABASE_USER}
        password = ""
        password = ${?DATABASE_PASSWORD}
        maxPoolSize = 10
        maxPoolSize = ${?DATABASE_POOL_SIZE}
        # Lo más que una petición espera una conexión libre, y lo más que dura una consulta. Juntos quedan muy por debajo
        # de los 20 s con que la app se rinde (ApiClient.kt): si la API terminara después, la app ya habría dicho que falló.
        connectionTimeoutSeconds = 5
        connectionTimeoutSeconds = ${?DATABASE_CONNECTION_TIMEOUT_SECONDS}
        statementTimeoutSeconds = 5
        statementTimeoutSeconds = ${?DATABASE_STATEMENT_TIMEOUT_SECONDS}
    }

    jwt {
        secret = ""
        secret = ${?JWT_SECRET}
        issuer = "exploracity-api"
        audience = "exploracity-app"
        # ADR-06 (D1): token de acceso corto y token de renovación largo.
        accessMinutes = 15
        refreshDays = 30
    }

    # Correos de las cuentas de moderador, separados por comas (ADR-06: cuentas precargadas).
    moderators = ""
    moderators = ${?MODERATOR_EMAILS}

    # La ciudad que atiende la app (F2): nombre, centro del mapa, límites de la búsqueda por dirección y la zona
    # horaria con la que se calculan «abierto ahora» y «Tu trabajo de hoy».
    city {
        name = "Armenia"
        center { latitude = 4.5339, longitude = -75.6811 }
        southwest { latitude = 4.47, longitude = -75.76 }
        northeast { latitude = 4.6, longitude = -75.62 }
        timeZone = "America/Bogota"
    }

    # C1 · Correo. Con SENDGRID_API_KEY se envía de verdad desde MAIL_FROM. Sin ella, los correos quedan en un buzón de
    # desarrollo que solo se consulta en /v1/dev con DEV_MAILBOX=true; nunca por omisión, porque en producción no existe.
    # Lo que queda vacío toma el valor por omisión de MailSettings (config/AppConfig.kt).
    mail {
        sendGridApiKey = ""
        sendGridApiKey = ${?SENDGRID_API_KEY}
        from = ""
        from = ${?MAIL_FROM}
        fromName = ""
        fromName = ${?MAIL_FROM_NAME}
        devMailbox = ""
        devMailbox = ${?DEV_MAILBOX}
        # Dónde abren los enlaces del correo (6.b y «Cambiar correo»): la app los recibe con su token. Vacío:
        # exploracity://enlace. En Cloud Run, la dirección de la API seguida de /enlace.
        linkBaseUrl = ""
        linkBaseUrl = ${?APP_LINK_BASE_URL}
    }

    # C1 · App Links: la app que abre los enlaces https del correo, y las huellas SHA-256 de su firma, separadas por
    # comas. Sin huellas no hay /.well-known/assetlinks.json y los enlaces abren la página «Abrir en ExploraCity».
    android {
        packageName = "co.edu.uniquindio.exploracity"
        certFingerprints = ""
        certFingerprints = ${?ANDROID_CERT_SHA256}
    }

    # ADR-15 · Entrar con Google: el ID del cliente OAuth «Web» (termina en .apps.googleusercontent.com). No es secreto.
    # Vacío: sin «Continuar con Google» (la API responde google_sign_in_unavailable).
    google {
        webClientId = ""
        webClientId = ${?GOOGLE_WEB_CLIENT_ID}
    }

    # C1 · Fotos (ADR-07). Con las tres claves de Cloudinary van allá; sin ellas, a una carpeta local (fuera de git) que
    # la API sirve en /media. Lo vacío toma el valor por omisión de MediaSettings.
    media {
        cloudinary {
            cloudName = ""
            cloudName = ${?CLOUDINARY_CLOUD_NAME}
            apiKey = ""
            apiKey = ${?CLOUDINARY_API_KEY}
            apiSecret = ""
            apiSecret = ${?CLOUDINARY_API_SECRET}
        }
        localDir = ""
        localDir = ${?MEDIA_DIR}
        # Comienzo de las direcciones de la carpeta local. Vacío: http://localhost:8080, que también sirve en el teléfono
        # con `adb reverse`; si la app usa la IP del equipo, esa misma.
        publicBaseUrl = ""
        publicBaseUrl = ${?PUBLIC_BASE_URL}
    }

    # C1 · Sugerencia de categoría (16, ADR-11). Con OPENROUTER_API_KEY la hace el modelo por OpenRouter; sin ella, una
    # versión de desarrollo por palabras clave. Lo vacío toma el valor por omisión de AiSettings.
    ai {
        openRouterApiKey = ""
        openRouterApiKey = ${?OPENROUTER_API_KEY}
        model = ""
        model = ${?OPENROUTER_MODEL}
    }
}
